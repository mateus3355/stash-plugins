name: Move File
description: >-
  Adds a "Move File" action to the scene page (moves the current scene's
  file) and to the scene list's bulk "..." menu when scenes are selected
  (moves all selected files at once). Small moves happen immediately;
  large selections run in the background as a Task Queue job instead of
  blocking the browser.
version: 1.0

settings:
  taskThreshold:
    displayName: Background Task Threshold
    description: >-
      When moving more than this many files at once, run it as a background
      Task Queue job instead of waiting on the request in the browser.
      Default is 20.
    type: NUMBER
  autoTagAfterMove:
    displayName: Auto Tag After Move
    description: >-
      After a successful move, queue an Auto Tag job scoped to the
      destination folder. Default is on.
    type: BOOLEAN
  deleteEmptySourceFolders:
    displayName: Delete Empty Source Folders
    description: >-
      After a successful move, delete each source folder left completely
      empty on disk - never a configured library path, and only when a
      real filesystem check confirms nothing (including untracked files)
      remains in it. Default is on.
    type: BOOLEAN

ui:
  javascript:
    - moveFile.js
  css:
    - moveFile.css

exec:
  - python
  - "{pluginDir}/moveFile.py"
interface: raw
